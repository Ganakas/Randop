[[permission]]
identifier = "allow-settings"
description = "Read the settings"
commands.allow = ["settings"]

[[permission]]
identifier = "allow-save-settings"
description = "Save the settings and the Explorer menu"
commands.allow = ["save_settings"]

[[permission]]
identifier = "allow-set-language"
description = "Change the language of the window and the Explorer menu"
commands.allow = ["set_language"]

[[permission]]
identifier = "allow-open-github"
description = "Open the project page"
commands.allow = ["open_github"]

[[permission]]
identifier = "allow-check-update"
description = "Check whether a newer version exists"
commands.allow = ["check_update"]

[[permission]]
identifier = "allow-install-update"
description = "Download and replace the program"
commands.allow = ["install_update"]
